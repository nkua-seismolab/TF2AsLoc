# TF2AsLoc configuration file (copy to config.yaml and edit for your deployment)
# Full parameter reference: docs/configuration.md

# ---------------------------------------------------------------------------
# DATABASE
# ---------------------------------------------------------------------------
database:
  # Credentials and DB name come from POSTGRES_* variables in .env
  host: "tf2asloc_db"
  port: 5432

# ---------------------------------------------------------------------------
# API
# ---------------------------------------------------------------------------
api:
  host: "0.0.0.0"
  port: 8000
  # Max events returned by GET /events in a single request
  max_events: 1000

# ---------------------------------------------------------------------------
# GLOBAL / NETWORK
# ---------------------------------------------------------------------------
global:
  # Agency code used in resource IDs and QuakeML author fields
  agency: "nkua"
  # Region label used in resource IDs
  region: "crl"
  # Authority for QuakeML smi: publicIDs, e.g. your institution's domain
  smi_authority: "nkua-sl"
  # StationXML inventory filename (in metadata/)
  inventory: "inventory/eida_greece_stations_response.xml"
  # FDSN-WS client URLs for inventory and waveform retrieval (single string, semicolon-separated)
  fdsn_ws_clients: "NOA; EPOSFR"
  # Station selection CSVs in metadata/ - one per client above (single string, semicolon-separated)
  csvfiles: "stations/eida_noa_stations_list.csv;stations/eida_eposfr_stations_list.csv"
  # Max retries for FDSN-WS requests on transient failures
  max_retries: 5
  # Delay (seconds) between FDSN-WS retries
  retry_delay: 3

# ---------------------------------------------------------------------------
# ASSOCIATOR - GaMMA
# ---------------------------------------------------------------------------
associator:
  # Minimum P-pick probability to include in association
  p_min_prob: 0.10
  # Minimum S-pick probability to include in association
  s_min_prob: 0.10

  # Broad bounding box - must encompass all stations
  latmin: 37.80
  latmax: 38.84
  lonmin: 21.47
  lonmax: 22.73

  # Narrow bounding box - events outside it are discarded after preliminary location
  latmin2: 38.1117
  latmax2: 38.4846
  lonmin2: 21.6593
  lonmax2: 22.3169

  # Focal depth limits (km) - broad
  zmin: 0
  zmax: 80
  # Focal depth limits (km) - narrow
  zmin2: 0
  zmax2: 80

  # P pick-probability -> HypoInverse weight thresholds (prob >= pwgt0 -> weight 0, ...)
  pwgt0: 0.8
  pwgt1: 0.5
  pwgt2: 0.2
  pwgt3: 0.1
  # S pick-probability -> HypoInverse weight thresholds
  swgt0: 0.9
  swgt1: 0.6
  swgt2: 0.3
  swgt3: 0.1

  # Reconciliation: max origin-time offset (s) to match a previously located event
  event_match_time_tol: 5
  # Reconciliation: max epicentre offset (degrees)
  event_match_coord_tol: 0.02

# ---------------------------------------------------------------------------
# GAMMA - GaMMA associator settings (https://github.com/AI4EPS/GaMMA)
# ---------------------------------------------------------------------------
gamma:
  # EPSG code of the local projected CRS (2100 = Greek Grid GGRS87)
  projection: 2100

  # Use Eikonal travel times from velmodel (false = homogeneous pvel/vpvs)
  use_eikonal: false
  # Velocity model filename in metadata/ (HypoInverse .crh format)
  velmodel: "hinv/model_rigo1996.crh"
  # Grid spacing (km) for Eikonal interpolation
  eikonal_h: 1.0

  # Homogeneous P velocity (km/s), used when use_eikonal: false
  pvel: 5.6
  # Vp/Vs ratio (also used in Eikonal mode)
  vpvs: 1.80

  # Clustering method: BGMM or GMM
  method: "BGMM"
  oversample_factor: 4
  # CPUs for GaMMA's internal pool (see docs note on multiprocessing)
  ncpu: 4

  # DBSCAN: max time between picks in the same cluster (s)
  dbscan_eps: 10
  # DBSCAN: min picks to form a core cluster point
  dbscan_min_samples: 3

  # Per-event filtering thresholds
  min_picks_per_eq: 5
  min_p_picks_per_eq: 3
  min_s_picks_per_eq: 2
  # Max phase time residual (s)
  max_sigma11: 2.0
  # Max phase amplitude residual (log scale)
  max_sigma22: 1.0
  # Max covariance term
  max_sigma12: 1.0

# ---------------------------------------------------------------------------
# MAGNITUDE
# ---------------------------------------------------------------------------
magnitude:
  # Parallel workers for amplitude measurement
  workers: 4
  # Bulk-download chunks per worker
  par_chunks: 1
  # Stations per bulk-download chunk
  chunksize: 8

  # Waveform extraction: seconds before earliest pick in event
  tbef: 30
  # Waveform extraction: seconds after latest pick in event
  taft: 90
  # Signal window: seconds before P arrival
  preP: 5
  # Signal window: seconds after P arrival
  postP: 40
  # Signal window: seconds before S arrival
  preS: 5
  # Signal window: seconds after S arrival
  postS: 10

  # Response removal pre-filter corner frequencies (Hz)
  prefilter: [0.5, 0.8, 10.0, 15.0]
  # Water level for response removal (dB)
  water_level: 60

  # Max wait (s) for FDSN waveform availability before skipping an event's magnitude
  max_waveform_wait_sec: 30

  # ML formula coefficients (Scordilis et al., 2013 - see docs/configuration.md)
  mag_n: 1.2614
  mag_K: 0.0031
  mag_c: 0.9043
  # ML reference distance (km)
  mag_dist: 100

  # Duration magnitude coefficients (Hypo71 RESET TEST* equivalents)
  test7: -1.1
  test8: 2.35
  test9: 0.0012

# ---------------------------------------------------------------------------
# LOCATOR - USGS HypoInverse (hyp1.40)
# ---------------------------------------------------------------------------
locator:
  # Velocity model filename in metadata/ (HypoInverse CRH format)
  model: "hinv/model_rigo1996.crh"
  # HypoInverse parameter file in metadata/ (raw ZTR/POS/DIS/ERR/DUR lines)
  params: "hinv/h2000_params.txt"
  # Use the GaMMA preliminary origin as trial hypocenter for HypoInverse
  use_trial: false

# ---------------------------------------------------------------------------
# ORCHESTRATOR
# ---------------------------------------------------------------------------
orchestrator:
  # Sliding pick window width (seconds) - each run looks back this far
  window_sec: 300
  # Extra look-back safety buffer (seconds) on top of window_sec
  overlap_sec: 10
  # Seconds between association runs - keep well below window_sec
  interval_sec: 60
  # Reload StationXML from FDSN-WS every N hours
  inventory_refresh_hours: 24
  # Duplicate-event threshold: max origin-time offset (s)
  dedup_time_sec: 5
  # Duplicate-event threshold: max epicentral distance (km)
  dedup_dist_km: 10
  # Drive the window from pick timestamps instead of wall clock (for backfill)
  replay: false
  # Also consume picks already in the DB from this UTC instant (remove/comment once backfill is done)
  # session_epoch: "2026-08-27T22:00:00"
