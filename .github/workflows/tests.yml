name: tests

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          # GaMMA has no PyPI release; httpx is needed by the API test client
          pip install "git+https://github.com/AI4EPS/GaMMA.git" httpx pytest

      - name: Run tests
        run: pytest tests/ -q
